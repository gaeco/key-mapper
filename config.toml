# keymapper configuration

# Which events to rewrite, by origin:
#   "nomachine" -- only keys injected by a NoMachine process (nxnode et al).
#                  The local MacBook keyboard keeps native macOS behaviour.
#   "synthetic" -- any key not coming from real hardware. Broader: catches
#                  NoMachine, but also osascript, other automation, etc.
#   "all"       -- every key, whatever its origin.
#
# Run `keymapper probe` to confirm which of these your setup can actually
# distinguish before relying on "nomachine".
source_filter = "nomachine"

# Where to install the tap. "session" is correct for normal use. "hid" sits
# earlier in the pipeline but generally needs root. Change only if the probe
# shows NoMachine events are invisible at the session tap.
tap_location = "session"

# nxnode's pid changes on every reconnect, so pid->origin lookups expire.
pid_cache_ttl_seconds = 30.0

# false: extra modifiers are tolerated, so Ctrl+Shift+C also converts (and keeps
#        its Shift). This matches Karabiner's `"optional": ["any"]`.
# true:  the chord must be exactly the "from" modifier and nothing else.
strict_modifiers = false

# A chord that pauses and resumes all remapping. Press once to pause (every key
# passes through untouched), press again to resume. It is swallowed rather than
# forwarded, so the frontmost app never sees it -- pick something no app needs.
#
# The chord must include at least one modifier, and matches strictly: exactly
# these modifiers and no others. It is not filtered by `source_filter`, so it
# works from the local keyboard as well as from the NoMachine client.
#
# Set `enabled = false` to remove it entirely.
[pause_hotkey]
key = "p"
modifiers = ["control", "option", "shift"]

# The mappings, in priority order: the first rule that matches an event wins, so
# any rule carving an exception out of the Control layer has to be written above
# the catch-all at the bottom, which would otherwise match first.

# The catch-all: every Ctrl+<key> becomes Cmd+<key>. `key = "any"` matches every
# keycode, so this replaces the per-key list this file used to carry -- there is
# no key to forget, and no entry to add when you want a new one.
#
# Consequence, and it is a large one: the *entire* Control layer is gone for the
# remote client, not just the handful of chords that have a Cmd equivalent. In a
# shell that means Ctrl+C no longer interrupts, Ctrl+D no longer sends EOF, and
# Ctrl+A/E/K/L/R/U/W no longer reach readline. The pause hotkey above is how you
# get them back for as long as you need them; it is matched before any rule, so
# it keeps working while paused.
#
# Also unchanged by this rule: flagsChanged events are passed through, so what is
# physically held is still Control. Shortcuts that need Command genuinely held --
# the Cmd+Tab app switcher staying open to cycle -- do not behave as they would
# with a real Cmd.
[[mapping]]
key = "any"
from = "control"
to = "command"

